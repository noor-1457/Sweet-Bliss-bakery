<!-- @defer{when bannerImages?.length}  -->
  <ion-row>
    <div>
      <swiper-container
      [slidesPerView]="1"
      [loop]="true"
      [spaceBetween]="10"
      [initialSlide]="0"
      [centeredSlides]="true"
      [pagination]="{clickable: true , dynamicBullets: true}"
      >
@for(image of bannerImages; track $index){
  <swiper-slide>
    <img [src]="image.banner" sizes="100%" [alt]="'Banner ' + image.id" />
  </swiper-slide>
}
      </swiper-container>
    </div>
  </ion-row>
